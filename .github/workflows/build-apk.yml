          child: ListTile(
            leading: const CircleAvatar(
              backgroundColor: fundo,
              child: Icon(Icons.person_outline, color: verde),
            ),
            title: const Text('Desenvolvido por'),
            subtitle: const Text('Emanuel Azevedo'),
          ),
        ),
        const SizedBox(height: 20),
        const Center(
          child: Text(
            'KONTA • Gestão Financeira Inteligente • 2026',
            textAlign: TextAlign.center,
            style: TextStyle(color: Colors.grey, fontSize: 12),
          ),
        ),
      ],
    );
  }

  @override
  Widget build(BuildContext context) {
    final titulos = ['KONTA', 'Movimentos', 'Definições'];

    return Scaffold(
      appBar: AppBar(
        title: Text(
          titulos[pagina],
          style: const TextStyle(fontWeight: FontWeight.bold),
        ),
        actions: [
          if (pagina == 0)
            IconButton(
              tooltip: 'Actualizar',
              onPressed: carregar,
              icon: const Icon(Icons.refresh),
            ),
        ],
      ),
      body: IndexedStack(
        index: pagina,
        children: [
          painelInicio(),
          paginaMovimentos(),
          paginaDefinicoes(),
        ],
      ),
      floatingActionButton: pagina == 2
          ? null
          : FloatingActionButton(
              backgroundColor: verde,
              foregroundColor: Colors.white,
              onPressed: () => novoMovimento(),
              child: const Icon(Icons.add),
            ),
      bottomNavigationBar: NavigationBar(
        selectedIndex: pagina,
        onDestinationSelected: (index) {
          setState(() => pagina = index);
        },
        destinations: const [
          NavigationDestination(
            icon: Icon(Icons.home_outlined),
            selectedIcon: Icon(Icons.home),
            label: 'Início',
          ),
          NavigationDestination(
            icon: Icon(Icons.receipt_long_outlined),
            selectedIcon: Icon(Icons.receipt_long),
            label: 'Movimentos',
          ),
          NavigationDestination(
            icon: Icon(Icons.settings_outlined),
            selectedIcon: Icon(Icons.settings),
            label: 'Definições',
          ),
        ],
      ),
    );
  }
