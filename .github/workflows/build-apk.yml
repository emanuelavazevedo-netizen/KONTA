        subtitle: Text(
          '${item['categoria'] ?? 'Outros'} • ${DateFormat('dd/MM/yyyy HH:mm').format(data)}',
        ),
        trailing: Text(
          '${entrada ? '+' : '-'}${dinheiro(valor)}',
