// -----------------------------------------------------------------------------
// ECRÃ DE ACESSO COM PIN
// -----------------------------------------------------------------------------
class AcessoKonta extends StatefulWidget {
  const AcessoKonta({super.key});

  @override
  State<AcessoKonta> createState() => _AcessoKontaState();
}

class _AcessoKontaState extends State<AcessoKonta> {
  final pinController = TextEditingController();
  final confirmarController = TextEditingController();

  bool carregando = true;
  bool configuracao = false;
  bool confirmar = false;
  String? pinGuardado;

  @override
  void initState() {
    super.initState();
    verificarPin();
  }

  @override
  void dispose() {
    pinController.dispose();
    confirmarController.dispose();
    super.dispose();
  }

  Future<void> verificarPin() async {
    pinGuardado = await armazenamentoSeguro.read(key: 'konta_pin');

    if (!mounted) return;
    setState(() {
      configuracao = pinGuardado == null;
      carregando = false;
    });
  }

  Future<void> entrar() async {
    final pin = pinController.text;

    if (pin.length != 6) {
      mensagem('Introduza os 6 dígitos.');
      return;
    }

    if (configuracao) {
      if (!confirmar) {
        confirmarController.text = pin;
        pinController.clear();
        setState(() => confirmar = true);
        return;
      }

      if (pin != confirmarController.text) {
        mensagem('Os PIN não coincidem. Tente novamente.');
        pinController.clear();
        return;
      }

      await armazenamentoSeguro.write(key: 'konta_pin', value: pin);
      if (!mounted) return;
      abrirPainel();
      return;
    }

    if (pin == pinGuardado) {
      abrirPainel();
    } else {
      mensagem('PIN incorrecto. Tente novamente.');
      pinController.clear();
    }
  }

  void abrirPainel() {
    Navigator.pushReplacement(
      context,
      MaterialPageRoute(builder: (_) => const PainelKonta()),
    );
  }

  void mensagem(String texto) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text(texto)),
    );
  }

  @override
  Widget build(BuildContext context) {
    if (carregando) {
      return const Scaffold(
        body: Center(child: CircularProgressIndicator(color: verde)),
      );
    }

    return Scaffold(
      body: SafeArea(
        child: Center(
          child: SingleChildScrollView(
            padding: const EdgeInsets.all(28),
            child: Column(
              children: [
                Container(
                  padding: const EdgeInsets.all(20),
                  decoration: BoxDecoration(
                    color: verde,
                    borderRadius: BorderRadius.circular(22),
                  ),
                  child: const Icon(
                    Icons.account_balance_wallet,
                    size: 48,
                    color: Colors.white,
                  ),
                ),
                const SizedBox(height: 18),
                const Text(
                  'KONTA',
                  style: TextStyle(
                    fontSize: 34,
                    fontWeight: FontWeight.bold,
                    color: verde,
                  ),
                ),
                const Text(
                  'GESTÃO FINANCEIRA INTELIGENTE',
                  style: TextStyle(
                    fontSize: 11,
                    letterSpacing: 1.5,
                    color: Colors.grey,
                  ),
                ),
                const SizedBox(height: 45),
                Text(
                  configuracao
                      ? (confirmar ? 'Confirme o seu PIN' : 'Crie o seu PIN de acesso')
                      : 'Bem-vindo de volta',
                  style: const TextStyle(
                    fontSize: 21,
                    fontWeight: FontWeight.bold,
                  ),
                ),
                const SizedBox(height: 10),
                Text(
                  configuracao
                      ? 'Escolha um código pessoal de 6 dígitos.'
                      : 'Introduza o PIN para entrar na KONTA.',
                  textAlign: TextAlign.center,
                  style: const TextStyle(color: Colors.grey),
                ),
                const SizedBox(height: 25),
                SizedBox(
                  width: 220,
                  child: TextField(
                    controller: pinController,
                    obscureText: true,
                    maxLength: 6,
                    keyboardType: TextInputType.number,
                    textAlign: TextAlign.center,
                    style: const TextStyle(fontSize: 27, letterSpacing: 12),
                    decoration: const InputDecoration(
                      hintText: '••••••',
                      counterText: '',
                    ),
                  ),
                ),
                const SizedBox(height: 20),
                SizedBox(
                  width: double.infinity,
                  height: 52,
                  child: FilledButton(
                    style: FilledButton.styleFrom(backgroundColor: verde),
                    onPressed: entrar,
                    child: Text(configuracao ? 'Continuar' : 'Entrar'),
                  ),
                ),
                const SizedBox(height: 60),
                const Text(
                  'Desenvolvido por',
                  style: TextStyle(color: Colors.grey, fontSize: 12),
                ),
                const Text(
                  'Emanuel Azevedo',
                  style: TextStyle(color: verde, fontWeight: FontWeight.bold),
                ),
                const SizedBox(height: 5),
                const Text(
                  '© 2026 KONTA',
                  style: TextStyle(color: Colors.grey, fontSize: 11),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }
}

// -----------------------------------------------------------------------------
// PAINEL PRINCIPAL
// -----------------------------------------------------------------------------
class PainelKonta extends StatefulWidget {
  const PainelKonta({super.key});

  @override
  State<PainelKonta> createState() => _PainelKontaState();
}

class _PainelKontaState extends State<PainelKonta> {
  List<Map<String, dynamic>> movimentos = [];
  String periodo = 'Todos';
  int pagina = 0;
  bool ocultarSaldo = false;

  final formato = NumberFormat('#,##0.00', 'pt_PT');

  String dinheiro(double valor) => '${formato.format(valor)} Kz';

  @override
  void initState() {
    super.initState();
    carregar();
  }

  Future<void> carregar() async {
    final dados = await KontaDatabase.listar();
    if (!mounted) return;
    setState(() => movimentos = dados);
  }

  List<Map<String, dynamic>> get filtrados {
    final agora = DateTime.now();

    return movimentos.where((m) {
      final data = DateTime.parse(m['data'] as String);

      if (periodo == 'Hoje') {
        return data.year == agora.year &&
            data.month == agora.month &&
            data.day == agora.day;
      }
      if (periodo == 'Este mês') {
        return data.year == agora.year && data.month == agora.month;
      }
      return true;
    }).toList();
  }

  double total(String tipo) {
    return filtrados
        .where((m) => m['tipo'] == tipo)
        .fold(
          0.0,
          (soma, m) => soma + (m['valor'] as num).toDouble(),
        );
  }

  double get receitas => total('Entrada');
  double get despesas => total('Saída');
  double get saldo => receitas - despesas;

  Future<void> novoMovimento({Map<String, dynamic>? movimento}) async {
    final descricao = TextEditingController(
      text: movimento?['descricao'] as String? ?? '',
    );
    final valor = TextEditingController(
      text: movimento == null
          ? ''
          : (movimento['valor'] as num).toString(),
    );

    String tipo = movimento?['tipo'] as String? ?? 'Entrada';
    String categoria = movimento?['categoria'] as String? ?? 'Outros';

    const categorias = [
      'Vendas',
      'Serviços',
      'Investimentos',
      'Alimentação',
      'Transporte',
      'Salários',
      'Renda',
      'Compras',
      'Energia',
      'Água',
      'Outros',
    ];

    await showDialog<void>(
      context: context,
      builder: (ctx) => StatefulBuilder(
        builder: (ctx, atualizar) => AlertDialog(
          title: Text(movimento == null ? 'Novo movimento' : 'Editar movimento'),
          content: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                DropdownButtonFormField<String>(
                  value: tipo,
                  decoration: const InputDecoration(labelText: 'Tipo'),
                  items: const [
                    DropdownMenuItem(
                      value: 'Entrada',
                      child: Text('Receita / Entrada'),
                    ),
                    DropdownMenuItem(
                      value: 'Saída',
                      child: Text('Despesa / Saída'),
                    ),
                  ],
                  onChanged: (v) {
                    if (v != null) atualizar(() => tipo = v);
                  },
                ),
                const SizedBox(height: 12),
                DropdownButtonFormField<String>(
                  value: categoria,
                  decoration: const InputDecoration(labelText: 'Categoria'),
                  items: categorias
                      .map((c) => DropdownMenuItem(value: c, child: Text(c)))
                      .toList(),
                  onChanged: (v) {
                    if (v != null) atualizar(() => categoria = v);
                  },
                ),
                const SizedBox(height: 12),
                TextField(
                  controller: descricao,
                  decoration: const InputDecoration(
                    labelText: 'Descrição',
                    hintText: 'Ex.: Venda de mercadoria',
                  ),
                ),
                const SizedBox(height: 12),
                TextField(
                  controller: valor,
                  keyboardType: const TextInputType.numberWithOptions(decimal: true),
                  decoration: const InputDecoration(labelText: 'Valor em Kz'),
                ),
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.pop(ctx),
              child: const Text('Cancelar'),
            ),
            FilledButton(
              onPressed: () async {
                final numero = double.tryParse(
                  valor.text.trim().replaceAll(' ', '').replaceAll(',', '.'),
                );

                if (descricao.text.trim().isEmpty ||
                    numero == null ||
                    !numero.isFinite ||
                    numero <= 0) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('Verifique a descrição e o valor.'),
                    ),
                  );
                  return;
                }

                await KontaDatabase.guardar(
                  id: movimento?['id'] as int?,
                  tipo: tipo,
                  descricao: descricao.text.trim(),
                  valor: numero,
                  categoria: categoria,
                );

                if (ctx.mounted) Navigator.pop(ctx);
                await carregar();
              },
              child: const Text('Guardar'),
            ),
          ],
        ),
      ),
    );

    descricao.dispose();
    valor.dispose();
  }

  Future<void> eliminarMovimento(int id) async {
    final confirmarEliminacao = await showDialog<bool>(
      context: context,
      builder: (ctx) => AlertDialog(
        title: const Text('Eliminar movimento?'),
        content: const Text('Esta operação não poderá ser desfeita.'),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(ctx, false),
            child: const Text('Cancelar'),
          ),
          FilledButton(
            onPressed: () => Navigator.pop(ctx, true),
            child: const Text('Eliminar'),
          ),
        ],
      ),
    );

    if (confirmarEliminacao == true) {
      await KontaDatabase.eliminar(id);
      await carregar();
    }
  }

  Future<void> alterarPin() async {
    final atual = TextEditingController();
    final novo = TextEditingController();
    final confirmarNovo = TextEditingController();

    final resultado = await showDialog<bool>(
      context: context,
      builder: (ctx) => AlertDialog(
        title: const Text('Alterar PIN'),
        content: SingleChildScrollView(
          child: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              TextField(
                controller: atual,
                obscureText: true,
                keyboardType: TextInputType.number,
                maxLength: 6,
                decoration: const InputDecoration(labelText: 'PIN actual'),
              ),
              TextField(
                controller: novo,
                obscureText: true,
                keyboardType: TextInputType.number,
                maxLength: 6,
                decoration: const InputDecoration(labelText: 'Novo PIN'),
              ),
              TextField(
                controller: confirmarNovo,
                obscureText: true,
                keyboardType: TextInputType.number,
                maxLength: 6,
                decoration: const InputDecoration(labelText: 'Confirmar PIN'),
              ),
            ],
          ),
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(ctx, false),
            child: const Text('Cancelar'),
          ),
          FilledButton(
            onPressed: () => Navigator.pop(ctx, true),
            child: const Text('Guardar'),
          ),
        ],
      ),
    );

    if (resultado == true) {
      final guardado = await armazenamentoSeguro.read(key: 'konta_pin');

      if (atual.text == guardado &&
          novo.text.length == 6 &&
          novo.text == confirmarNovo.text) {
        await armazenamentoSeguro.write(key: 'konta_pin', value: novo.text);

        if (mounted) {
          ScaffoldMessenger.of(context).showSnackBar(
            const SnackBar(content: Text('PIN alterado com sucesso.')),
          );
        }
      } else if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('Dados do PIN inválidos.')),
        );
      }
    }

    atual.dispose();
    novo.dispose();
    confirmarNovo.dispose();
  }

