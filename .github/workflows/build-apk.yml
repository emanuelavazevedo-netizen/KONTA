// -----------------------------------------------------------------------------
// BASE DE DADOS
// Mantém o nome, a versão e a estrutura da base de dados já utilizada.
// Não apagar a aplicação nem limpar os dados ao instalar a nova versão.
// -----------------------------------------------------------------------------
class KontaDatabase {
  static Database? _db;

  static Future<Database> get database async {
    if (_db != null) return _db!;

    final caminho = p.join(await getDatabasesPath(), 'konta.db');

    _db = await openDatabase(
      caminho,
      version: 2,
      onCreate: (db, version) async {
        await db.execute('''
          CREATE TABLE movimentos (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            tipo TEXT NOT NULL,
            descricao TEXT NOT NULL,
            valor REAL NOT NULL,
            data TEXT NOT NULL,
            categoria TEXT NOT NULL DEFAULT 'Outros'
          )
        ''');
      },
      onUpgrade: (db, oldVersion, newVersion) async {
        if (oldVersion < 2) {
          await db.execute(
            "ALTER TABLE movimentos ADD COLUMN categoria TEXT NOT NULL DEFAULT 'Outros'",
          );
        }
      },
    );

    return _db!;
  }

  static Future<List<Map<String, dynamic>>> listar() async {
    final db = await database;
    return db.query('movimentos', orderBy: 'id DESC');
  }

  static Future<void> guardar({
    int? id,
    required String tipo,
    required String descricao,
    required double valor,
    required String categoria,
  }) async {
    final db = await database;

    final Map<String, Object?> dados = {
      'tipo': tipo,
      'descricao': descricao,
      'valor': valor,
      'categoria': categoria,
    };

    if (id == null) {
      dados['data'] = DateTime.now().toIso8601String();
      await db.insert('movimentos', dados);
    } else {
      await db.update(
        'movimentos',
        dados,
        where: 'id = ?',
        whereArgs: [id],
      );
    }
  }

  static Future<void> eliminar(int id) async {
    final db = await database;
    await db.delete('movimentos', where: 'id = ?', whereArgs: [id]);
  }
}

